name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [18, 20]

    # Ephemeral Postgres for the tests — seeded from db/schema.sql + db/seed.sql.
    # No production database or credentials are ever used in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chieta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: chieta_test
      DB_USER_NAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: ""
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Load schema + seed into test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d chieta_test -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -U postgres -d chieta_test -v ON_ERROR_STOP=1 -f db/seed.sql

      - name: Run tests
        run: npm test
